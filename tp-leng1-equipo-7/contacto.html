<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red de Rodolfo al Rescate - contacto</title>
    <link rel="stylesheet" href="./CSS/estilos.css">
</head>
<body>
    <header>
        <img src="./IMG/LOGO_ONG.png" alt="Logo ONG" width="300">
        <h1>Red de Rodolfo al Rescate</h1>
        <h2>Fundación de ayuda a los animales</h2>
        <nav>
            <ul>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./nosotros.html">Nosotros</a></li>
                <li><a href="./programas.html">Programas</a></li>
            </ul>
        </nav>

        <nav>
            <a href="#redes">Redes</a>
        </nav>
    
    </header>
    <main>
        <h2>Sumate como voluntario</h2>
        <p>Complete el formulario o escribinos a <a href="mailto:info@RedDeRodolfoAlRescate.org.ar">info@RedDeRodolfoAlRescate.org.ar</a></p>
        <form action="#" method="post">
            <label for="nombre">Nombre y apellido</label>
            <input type="text" id="nombre" name="nombre" placeholder="ej: María García" required>
            <br>
            <label for="email">Correo electrónico</label>
            <input type="email" name="email" id="email" placeholder="tucorreo@email.com" required>
            <br>
            <label for="telefono">Teléfono</label>
            <input type="tel" name="teléfono" id="telefono" placeholder="+54 11 1234-5678">
            <br>
            <label for="programa">Programas de interés</label>
            <select name="programa" id="programa" required>
                <option value="">elegir programa...</option>
                <option value="pldc">Un nuevo hogar</option>
                <option value="met">Rescate y recuperación</option>
                <option value="ec">Por un mundo mejor</option>
            </select>
            <label for="disponibilidad">Disponibilidad</label>
            <select name="disponibilidad" id="disponibilidad" required>
                <option value="mañana">mañana</option>
                <option value="tarde">tarde</option>
                <option value="noche">noche</option>
            </select>
            <br>
            <label for="mensaje">¿Por qué quieres sumarte?</label>
            <textarea name="mensaje" id="mensaje" placeholder="contanos un poco..."></textarea>
            <br>
            <button type="submit">enviar</button>
        </form>
    </main>
    <footer>
        <div id="redes" class="redes-sociales">
            <a href="https://www.facebook.com" target="_blank">
                <img src="./IMG/facebook.png" alt="Facebook">
            </a>

            <a href="https://www.instagram.com" target="_blank">
                <img src="./IMG/instagram.png" alt="Instagram">
            </a>

            <a href="https://www.x.com" target="_blank">
                <img src="./IMG/x.png" alt="Twitter">
            </a>
        </div>
        <p><small>Red de Rodolfo al Rescate &copy; 2026</small></p>
    </footer>
</body>
</html>
